<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Reset Password | Olivia Admin</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

<div class="admin-login">

    <div class="login-box">

        <!-- Logo -->
        <div class="logo">
            <span class="logo-mark">O</span>

            <span>
                Olivia Admin
                <small>Secure Dashboard</small>
            </span>
        </div>

        <!-- Heading -->
        <h2>Reset Password</h2>

        <p class="muted">
            Enter your new admin password below.
        </p>

        <!-- Reset Password Form -->
        <form id="resetForm">

            <input
                class="input"
                id="password"
                type="password"
                placeholder="New password"
                autocomplete="new-password"
                minlength="6"
                required
                style="margin-bottom:12px"
            >

            <input
                class="input"
                id="confirmPassword"
                type="password"
                placeholder="Confirm new password"
                autocomplete="new-password"
                minlength="6"
                required
                style="margin-bottom:12px"
            >

            <button
                type="submit"
                class="btn btn-primary"
                id="resetButton"
                style="width:100%"
                disabled
            >
                Checking Reset Link...
            </button>

            <div id="status"></div>

        </form>

        <!-- Back to Login -->
        <div
            style="
                text-align:center;
                margin-top:16px;
            "
        >
            <a
                href="login.html"
                style="
                    color:#2563eb;
                    text-decoration:none;
                    font-weight:600;
                "
            >
                ← Back to Login
            </a>
        </div>

    </div>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>


<script>

let supabaseClient = null;
let recoverySessionReady = false;


/*
 * Status message
 */
function showStatus(message, type) {

    const status =
        document.getElementById("status");

    status.className =
        "alert " + type;

    status.textContent =
        message;
}


/*
 * Enable reset form
 */
function enableResetForm() {

    recoverySessionReady = true;

    const button =
        document.getElementById("resetButton");

    button.disabled = false;

    button.textContent =
        "Update Password";

    showStatus(
        "Reset link verified. You can now create your new password.",
        "success"
    );
}


/*
 * Disable reset form
 */
function disableResetForm(message) {

    recoverySessionReady = false;

    const button =
        document.getElementById("resetButton");

    button.disabled = true;

    button.textContent =
        "Update Password";

    showStatus(
        message,
        "error"
    );
}


/*
 * Start Supabase
 */
async function startPasswordRecovery() {

    try {

        supabaseClient =
            await initSupabase();


        if (!supabaseClient) {

            disableResetForm(
                "Supabase is not configured. Please check your Supabase settings."
            );

            return;
        }


        /*
         * Listen for the PASSWORD_RECOVERY event.
         *
         * Supabase creates the recovery session
         * when the user opens the email link.
         */
        const { data } =
            supabaseClient.auth.onAuthStateChange(
                function(event, session) {

                    console.log(
                        "Supabase Auth Event:",
                        event,
                        session
                    );


                    if (
                        event === "PASSWORD_RECOVERY"
                        && session
                    ) {

                        enableResetForm();

                    }

                }
            );


        /*
         * Also check the current session.
         *
         * This helps when the session has already
         * been established before the listener runs.
         */
        const {
            data: sessionData,
            error: sessionError
        } =
            await supabaseClient.auth.getSession();


        if (sessionError) {

            console.error(sessionError);

        }


        if (
            sessionData
            && sessionData.session
        ) {

            enableResetForm();

            return;
        }


        /*
         * Give Supabase a moment to process the
         * recovery information from the URL.
         */
        setTimeout(async function() {

            const {
                data: latestSession
            } =
                await supabaseClient.auth.getSession();


            if (
                latestSession
                && latestSession.session
            ) {

                enableResetForm();

            } else {

                disableResetForm(
                    "This password reset link is invalid or has expired. Please request a new reset link."
                );

            }

        }, 1500);


    } catch (error) {

        console.error(error);

        disableResetForm(
            "Unable to verify the password reset link. Please request a new link."
        );

    }

}


/*
 * Password reset form
 */
document
.getElementById("resetForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /*
         * Make sure recovery session exists
         */
        if (
            !supabaseClient
            || !recoverySessionReady
        ) {

            showStatus(
                "Password reset session is missing. Please open the latest reset link from your email.",
                "error"
            );

            return;
        }


        const password =
            document
            .getElementById("password")
            .value
            .trim();


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value
            .trim();


        const resetButton =
            document
            .getElementById("resetButton");


        /*
         * Check password match
         */
        if (
            password !== confirmPassword
        ) {

            showStatus(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        /*
         * Minimum length
         */
        if (
            password.length < 6
        ) {

            showStatus(
                "Password must be at least 6 characters long.",
                "error"
            );

            return;
        }


        resetButton.disabled = true;

        resetButton.textContent =
            "Updating...";


        showStatus(
            "Updating your password...",
            "success"
        );


        try {

            /*
             * Update password
             */
            const { error } =
                await supabaseClient.auth.updateUser({

                    password:
                        password

                });


            if (error) {

                console.error(error);

                showStatus(
                    error.message,
                    "error"
                );

                resetButton.disabled = false;

                resetButton.textContent =
                    "Update Password";

                return;
            }


            /*
             * Success
             */
            showStatus(
                "Password updated successfully. Redirecting to login...",
                "success"
            );


            resetButton.textContent =
                "Password Updated";


            /*
             * Sign out the recovery session
             * after successful password change.
             */
            await supabaseClient.auth.signOut();


            /*
             * Go to login page
             */
            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 2000);


        } catch (error) {

            console.error(error);

            showStatus(
                "Something went wrong. Please try again.",
                "error"
            );

            resetButton.disabled = false;

            resetButton.textContent =
                "Update Password";

        }

    }
);


/*
 * Start password recovery
 */
startPasswordRecovery();

</script>

</body>

</html>
