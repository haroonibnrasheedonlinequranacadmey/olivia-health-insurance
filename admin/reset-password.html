<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Reset Password | Olivia Admin</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

<div class="admin-login">

    <div class="login-box">

        <!-- Logo -->
        <div class="logo">
            <span class="logo-mark">O</span>

            <span>
                Olivia Admin
                <small>Secure Dashboard</small>
            </span>
        </div>

        <!-- Heading -->
        <h2>Reset Password</h2>

        <p class="muted">
            Enter your new admin password below.
        </p>

        <!-- Reset Password Form -->
        <form id="resetForm">

            <input
                class="input"
                id="password"
                type="password"
                placeholder="New password"
                autocomplete="new-password"
                minlength="6"
                required
                style="margin-bottom:12px"
            >

            <input
                class="input"
                id="confirmPassword"
                type="password"
                placeholder="Confirm new password"
                autocomplete="new-password"
                minlength="6"
                required
                style="margin-bottom:12px"
            >

            <button
                type="submit"
                class="btn btn-primary"
                id="resetButton"
                style="width:100%"
            >
                Update Password
            </button>

            <!-- Status Message -->
            <div id="status"></div>

        </form>

        <!-- Back to Login -->
        <div
            style="
                text-align:center;
                margin-top:16px;
            "
        >
            <a
                href="login.html"
                style="
                    color:#2563eb;
                    text-decoration:none;
                    font-weight:600;
                "
            >
                ← Back to Login
            </a>
        </div>

    </div>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>


<script>

let supabaseClient = null;


/*
 * Initialize Supabase
 */
async function initializeSupabase() {

    try {

        supabaseClient =
            await initSupabase();

        if (!supabaseClient) {

            showStatus(
                "Supabase is not configured. Please check your Supabase settings.",
                "error"
            );

            return false;
        }

        return true;

    } catch (error) {

        console.error(error);

        showStatus(
            "Unable to connect to Supabase.",
            "error"
        );

        return false;
    }
}


/*
 * Show status message
 */
function showStatus(message, type) {

    const status =
        document.getElementById("status");

    status.className =
        "alert " + type;

    status.textContent =
        message;
}


/*
 * Reset password
 */
document
.getElementById("resetForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const password =
        document
        .getElementById("password")
        .value;

    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;

    const resetButton =
        document
        .getElementById("resetButton");


    /*
     * Check passwords
     */
    if (password !== confirmPassword) {

        showStatus(
            "Passwords do not match.",
            "error"
        );

        return;
    }


    /*
     * Minimum password length
     */
    if (password.length < 6) {

        showStatus(
            "Password must be at least 6 characters long.",
            "error"
        );

        return;
    }


    resetButton.disabled = true;

    resetButton.textContent =
        "Updating...";

    showStatus(
        "Updating your password...",
        "success"
    );


    try {

        /*
         * Make sure Supabase is available
         */
        if (!supabaseClient) {

            const initialized =
                await initializeSupabase();

            if (!initialized) {

                resetButton.disabled = false;

                resetButton.textContent =
                    "Update Password";

                return;
            }
        }


        /*
         * Update password
         */
        const { error } =
            await supabaseClient.auth.updateUser({
                password: password
            });


        if (error) {

            console.error(error);

            showStatus(
                error.message,
                "error"
            );

            resetButton.disabled = false;

            resetButton.textContent =
                "Update Password";

            return;
        }


        /*
         * Password updated successfully
         */
        showStatus(
            "Password updated successfully. You can now login with your new password.",
            "success"
        );


        resetButton.textContent =
            "Password Updated";


        /*
         * Redirect to login after a short delay
         */
        setTimeout(function() {

            window.location.href =
                "login.html";

        }, 2500);


    } catch (error) {

        console.error(error);

        showStatus(
            "Something went wrong. Please try again.",
            "error"
        );

        resetButton.disabled = false;

        resetButton.textContent =
            "Update Password";

    }

});


/*
 * Initialize when page loads
 */
initializeSupabase();

</script>

</body>

</html>
