<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Admin Login | Olivia</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

<div class="admin-login">

    <div class="login-box">

        <div class="logo">
            <span class="logo-mark">O</span>
            <span>
                Olivia Admin
                <small>Secure Dashboard</small>
            </span>
        </div>

        <h2>Admin Login</h2>

        <p class="muted">
            Sign in to access the secure admin dashboard.
        </p>

        <form id="loginForm">

            <input
                class="input"
                id="email"
                type="email"
                placeholder="Admin email"
                required
                style="margin-bottom:9px"
            >

            <input
                class="input"
                id="password"
                type="password"
                placeholder="Password"
                required
                style="margin-bottom:9px"
            >

            <button
                type="submit"
                class="btn btn-primary"
                style="width:100%"
            >
                Sign In
            </button>

            <div
                style="
                    text-align:center;
                    margin-top:14px;
                "
            >
                <a
                    href="forgot-password.html"
                    style="
                        color:#2563eb;
                        text-decoration:none;
                        font-weight:600;
                    "
                >
                    Forgot Password?
                </a>
            </div>

            <div id="status"></div>

        </form>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>


<script>

document.getElementById("loginForm").onsubmit = async function(event) {

    event.preventDefault();

    const status = document.getElementById("status");

    status.className = "";
    status.textContent = "Signing in...";

    const supabase = await initSupabase();

    if (!supabase) {

        status.className = "alert error";

        status.textContent =
            "Supabase is not configured. Please check your Supabase settings.";

        return;
    }


    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    const { data, error } =
        await supabase.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        status.className = "alert error";

        status.textContent = error.message;

        return;
    }


    if (data.session) {

        status.className = "alert success";

        status.textContent = "Login successful. Opening dashboard...";

        setTimeout(function() {

            window.location.href = "dashboard.html";

        }, 500);

    }

};

</script>

</body>
</html>
