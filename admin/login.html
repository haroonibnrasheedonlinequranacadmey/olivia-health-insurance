<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head><body><div class="admin-login"><div class="login-box"><div class="logo"><span class="logo-mark">O</span><span>Olivia Admin<small>Secure Dashboard</small></span></div><h2>Admin Login</h2><p class="muted">Use the Supabase Auth administrator account.</p><form id="f"><input class="input" id="e" type="email" placeholder="Admin email" required style="margin-bottom:9px"><input class="input" id="p" type="password" placeholder="Password" required style="margin-bottom:9px"><button class="btn btn-primary" style="width:100%">Sign In</button><div id="s"></div></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script>document.getElementById("f").onsubmit=async function(x){x.preventDefault();var s=document.getElementById("s"),sb=await initSupabase();if(!sb){s.className="alert error";s.textContent="Add Supabase URL and anon key first.";return}var r=await sb.auth.signInWithPassword({email:document.getElementById("e").value,password:document.getElementById("p").value});if(r.error){s.className="alert error";s.textContent=r.error.message}else location.href="dashboard.html"}</script></body></html>
