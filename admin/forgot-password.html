<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Forgot Password | Olivia Admin</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

<div class="admin-login">

    <div class="login-box">

        <!-- Logo -->
        <div class="logo">
            <span class="logo-mark">O</span>

            <span>
                Olivia Admin
                <small>Secure Dashboard</small>
            </span>
        </div>

        <!-- Heading -->
        <h2>Forgot Password?</h2>

        <p class="muted">
            Enter your admin email address and we will send you a secure
            password reset link.
        </p>

        <!-- Forgot Password Form -->
        <form id="forgotForm">

            <input
                class="input"
                id="email"
                type="email"
                placeholder="Admin email"
                autocomplete="email"
                required
                style="margin-bottom:12px"
            >

            <button
                type="submit"
                class="btn btn-primary"
                id="sendButton"
                style="width:100%"
            >
                Send Reset Link
            </button>

            <!-- Status Message -->
            <div id="status"></div>

        </form>

        <!-- Back to Login -->
        <div
            style="
                text-align:center;
                margin-top:16px;
            "
        >
            <a
                href="login.html"
                style="
                    color:#2563eb;
                    text-decoration:none;
                    font-weight:600;
                "
            >
                ← Back to Login
            </a>
        </div>

    </div>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>


<script>

document
.getElementById("forgotForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const status =
        document.getElementById("status");

    const sendButton =
        document.getElementById("sendButton");


    status.className = "";

    status.textContent =
        "Sending password reset link...";

    sendButton.disabled = true;

    sendButton.textContent =
        "Sending...";


    try {

        /*
         * Load Supabase client
         */
        const supabase =
            await initSupabase();


        if (!supabase) {

            status.className =
                "alert error";

            status.textContent =
                "Supabase is not configured. Please check your Supabase settings.";

            sendButton.disabled = false;

            sendButton.textContent =
                "Send Reset Link";

            return;
        }


        /*
         * Get email
         */
        const email =
            document
            .getElementById("email")
            .value
            .trim();


        /*
         * Detect GitHub Pages repository path automatically.
         *
         * Your website:
         * https://haroonibnrasheedonlinequranacadmey.github.io/olivia-health-insurance/
         *
         * Reset page:
         * /olivia-health-insurance/admin/reset-password.html
         */
        const currentPath =
            window.location.pathname;


        const adminIndex =
            currentPath.indexOf("/admin/");


        let basePath = "";


        if (adminIndex !== -1) {

            basePath =
                currentPath.substring(
                    0,
                    adminIndex
                );

        }


        const resetUrl =
            window.location.origin +
            basePath +
            "/admin/reset-password.html";


        /*
         * Send password reset email
         */
        const { error } =
            await supabase.auth.resetPasswordForEmail(
                email,
                {
                    redirectTo: resetUrl
                }
            );


        if (error) {

            status.className =
                "alert error";

            status.textContent =
                error.message;

            sendButton.disabled = false;

            sendButton.textContent =
                "Send Reset Link";

            return;
        }


        /*
         * Success
         */
        status.className =
            "alert success";

        status.textContent =
            "Password reset link has been sent to your email. Please check your inbox and spam folder.";


        sendButton.textContent =
            "Reset Link Sent";


    } catch (error) {

        status.className =
            "alert error";

        status.textContent =
            "Something went wrong. Please try again.";


        sendButton.disabled = false;

        sendButton.textContent =
            "Send Reset Link";

    }

});

</script>

</body>

</html>
