<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Files</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-shell"><header class="admin-nav"><div class="container"><a href="dashboard.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:10px"><img src="../assets/images/olivia-logo.svg" alt="Olivia" style="height:40px;width:auto"><strong>Admin Panel</strong></a><button class="btn btn-secondary" onclick="logoutAdmin()">Log out</button></div></header><div class="container admin-layout"><aside class="admin-sidebar"><a href="dashboard.html">Dashboard</a><a href="settings.html">Site Settings</a><a href="team.html">Team</a><a href="services.html">Services</a><a href="plans.html">Plans</a><a href="leads.html">Leads</a><a href="consultations.html">Consultations</a><a href="media.html">Media Files</a><a href="../index.html">View Website</a></aside><main><h1>Media Files</h1><p class="muted">Upload private images/documents to your Supabase Storage library. These files are separate from the website source files.</p><div class="admin-card"><form id="uploadForm"><input class="input" id="file" type="file" required><button class="btn btn-primary" style="margin-top:12px">Upload File</button><div id="status"></div></form></div><div class="admin-card" style="margin-top:18px"><h3>Stored Files</h3><div id="list" class="muted">Loading…</div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script src="../js/admin.js"></script><script>
(async()=>{const sb=await requireAdmin();if(!sb)return;const status=document.getElementById('status'),list=document.getElementById('list');
async function refresh(){const r=await sb.storage.from('site-files').list('',{limit:100,sortBy:{column:'name',order:'asc'}});if(r.error){list.innerHTML='<div class="alert error">'+r.error.message+'</div>';return}if(!r.data.length){list.textContent='No files uploaded yet.';return}list.innerHTML='';for(const f of r.data){const row=document.createElement('div');row.style.cssText='display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #e5edf5';const name=document.createElement('span');name.textContent=f.name;const actions=document.createElement('span');const dl=document.createElement('button');dl.className='btn btn-secondary';dl.textContent='Open';dl.onclick=async()=>{const x=await sb.storage.from('site-files').createSignedUrl(f.name,3600);if(x.data?.signedUrl)window.open(x.data.signedUrl,'_blank')};const del=document.createElement('button');del.className='btn btn-secondary';del.textContent='Delete';del.onclick=async()=>{if(!confirm('Delete '+f.name+'?'))return;const x=await sb.storage.from('site-files').remove([f.name]);if(x.error)alert(x.error.message);else refresh()};actions.append(dl,del);row.append(name,actions);list.append(row)}}
document.getElementById('uploadForm').onsubmit=async e=>{e.preventDefault();const file=document.getElementById('file').files[0];if(!file)return;status.className='alert';status.textContent='Uploading…';const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=Date.now()+'-'+safe;const r=await sb.storage.from('site-files').upload(path,file,{upsert:false});if(r.error){status.className='alert error';status.textContent=r.error.message}else{status.className='alert success';status.textContent='File uploaded.';e.target.reset();refresh()}};refresh()})()
</script></body></html>
