<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consultations</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-shell"><header class="admin-nav"><div class="container"><strong>Olivia Admin</strong><button class="btn btn-secondary" onclick="logoutAdmin()">Log out</button></div></header><div class="container admin-layout"><aside class="admin-sidebar"><a href="dashboard.html">Dashboard</a><a href="settings.html">Site Settings</a><a href="team.html">Team</a><a href="services.html">Services</a><a href="plans.html">Plans</a><a href="leads.html">Leads</a><a href="consultations.html">Consultations</a><a href="../index.html">View Website</a></aside><main><h1>Consultations</h1><p class="muted">Incoming consultations from the public website.</p><div class="admin-card" style="overflow:auto"><table class="data-table"><thead><tr><th>Created At</th><th>Name</th><th>Method</th><th>Preferred Date</th><th>Preferred Time</th><th>Phone</th><th>Email</th><th>Message</th></tr></thead><tbody id="r"></tbody></table></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script src="../js/admin.js"></script><script>(async()=>{var s=await requireAdmin();if(!s)return;var q=await s.from("consultations").select("*").order("created_at",{ascending:false});var r=document.getElementById("r");if(q.error){r.innerHTML="<tr><td>"+q.error.message+"</td></tr>";return};r.innerHTML=(q.data||[]).map(x=>`<tr>`<td>${x["created_at"]||""}</td>`+`<td>${x["name"]||""}</td>`+`<td>${x["method"]||""}</td>`+`<td>${x["preferred_date"]||""}</td>`+`<td>${x["preferred_time"]||""}</td>`+`<td>${x["phone"]||""}</td>`+`<td>${x["email"]||""}</td>`+`<td>${x["message"]||""}</td>`</tr>`).join("")})()</script></body></html>
